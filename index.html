<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoice Comparison — Invoices #8 and #9</title>
  <style>
    :root{
      --ink:#050505;
      --paper:#fff;
      --subtotal:#d7d7d7;
      --rule:#111;
      --canvas:#e8e8e8;
      --period:#c4c4c4;
      --this-period:#fff3b0;
      --pct-change:#e7f0ff;
      --hover:#fff8d6;
      --match:#cfe9d4;
      --match-fill:#eef7f0;
      --match-sub:#e4f0e6;
      --note:#5c3b00;
      --invoice-count:2;
      --panel:536px;
      --arrow:32px;
    }
    *{box-sizing:border-box}
    body{margin:0;color:var(--ink);background:var(--canvas);font-family:"Arial Narrow",Arial,Helvetica,sans-serif;font-variant-numeric:tabular-nums}
    .page{width:100%;min-height:100vh;overflow-x:auto;padding:8px 8px 16px}
    .page-inner{width:max-content;margin:0 auto}
    .notes{width:calc(var(--panel) * var(--invoice-count) + 8px);margin:0 0 7px calc(var(--arrow) + 8px);padding:5px 8px;background:#fff8e8;border:1px solid #e0c48a;color:var(--note);font-size:11px;line-height:1.35}
    .notes strong{font-weight:700}
    .legend{display:flex;gap:14px;flex-wrap:wrap;width:calc(var(--panel) * var(--invoice-count) + 8px);margin:0 0 6px calc(var(--arrow) + 8px);font-size:10px;color:#333}
    .legend span{display:inline-flex;align-items:center;gap:5px}
    .swatch{display:inline-block;width:11px;height:11px;border:1px solid #999;flex-shrink:0}
    .comparison-shell{display:flex;align-items:center;gap:8px;width:max-content}
    .nav-arrow{flex:0 0 var(--arrow);width:var(--arrow);height:var(--arrow);padding:0;border:1px solid var(--rule);border-radius:50%;background:var(--paper);color:var(--ink);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.12);cursor:pointer}
    .nav-arrow svg{width:14px;height:14px;display:block}
    .nav-arrow:not(:disabled):hover{background:#f2f2f2}
    .nav-arrow:not(:disabled):focus-visible{outline:2px solid var(--ink);outline-offset:2px}
    .nav-arrow:disabled{color:#8a8a8a;border-color:#b0b0b0;background:#fafafa;box-shadow:none;cursor:not-allowed}
    .comparison-grid{display:grid;grid-template-columns:repeat(var(--invoice-count),var(--panel));gap:8px;width:max-content}
    .invoice-page{min-width:0;padding:8px 8px 12px;background:var(--paper);box-shadow:0 2px 12px rgba(0,0,0,.1)}
    .invoice-title{margin:1px 0 5px;font-size:18px;line-height:1.1;text-align:center}
    .billing-period{display:grid;grid-template-columns:1fr 78px 18px 78px;align-items:end;min-height:20px;margin-bottom:1px;border-bottom:1px solid var(--rule);font-size:11px;font-weight:700;font-style:italic}
    .billing-period .from,.billing-period .to-date,.billing-period .word-to{text-align:center}
    .billing-period .from,.billing-period .to-date{border-bottom:1px solid var(--period);font-style:italic}
    .billing-period .word-to{font-style:normal;font-weight:700}
    table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:10.5px;line-height:1}
    col.description{width:35%}col.amount{width:12.5%}col.percent{width:7.5%}col.money{width:11.25%}
    thead tr{height:28px}
    thead th{padding:1px 2px 2px;border-bottom:1px solid var(--rule);font-weight:400;line-height:1.1;text-align:right;vertical-align:bottom}
    thead th:first-child{text-align:left}
    tbody tr.item{height:16px}tbody tr.stage{height:17px}tbody tr.subtotal{height:16px}tbody tr.summary{height:20px}tbody tr.spacer{height:10px}tbody tr.grand-total{height:22px}
    tbody td{padding:0 2px;vertical-align:middle}
    td.description{overflow:hidden;white-space:nowrap;text-overflow:clip}
    td.num{text-align:right;white-space:nowrap}
    tr.stage td{padding-top:2px;font-weight:700}
    tr.subtotal td,tr.summary td{background:var(--subtotal);font-weight:700}
    tr.grand-total td{padding-top:3px;border-top:1px solid var(--rule);border-bottom:3px double var(--rule);font-weight:700}
    td.this-period{background:var(--this-period)}
    td.pct-change{background:var(--pct-change)}
    tr.subtotal td.this-period,tr.summary td.this-period,tr.grand-total td.this-period{background:#f0e08a}
    tr.hover td,tr.hover td.this-period,tr.hover td.pct-change{box-shadow:inset 0 0 0 1px #c9a227;background:var(--hover)}
    tr.subtotal.hover td,tr.summary.hover td{background:#eee2a8}
    th.same-col,td.same-col{background:var(--match-fill)}
    tr.subtotal td.same-col,tr.summary td.same-col,tr.grand-total td.same-col{background:var(--match-sub)}
    tr.hover td.same-col,tr.hover td.same-col.this-period,tr.hover td.same-col.pct-change{background:var(--match-fill)}
    tr.subtotal.hover td.same-col,tr.summary.hover td.same-col{background:var(--match-sub)}
    .penny{margin:6px 0 0;font-size:9.5px;line-height:1.3;color:#7a2e00;min-height:2.6em}
    @media(min-width:1600px){table{font-size:11px}:root{--panel:560px}}
    @media(max-width:760px){.page{padding:0}.comparison-grid{gap:6px}.invoice-page{box-shadow:none}}
    @media print{
      @page{size:legal landscape;margin:.28in}
      body{background:#fff}
      .page{padding:0;overflow:visible}
      .notes,.legend{break-inside:avoid;margin-left:0}
      .nav-arrow{display:none}
      .comparison-grid{width:100%;gap:8px}
      .invoice-page{padding:4px;box-shadow:none}
      .invoice-title{font-size:13px}
      table,.billing-period{font-size:8px}
      td.this-period,td.pct-change{background:#eee !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      th.same-col,td.same-col{background:var(--match-fill) !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    }
  </style>
</head>

    const PAIR=2;
    const ordered=[...invoices].sort((a,b)=>a.number-b.number);
    let startIndex=Math.max(0,ordered.length-PAIR);
    document.documentElement.style.setProperty('--invoice-count',PAIR);
    document.querySelector('#source-notes').innerHTML=
      '<strong>Numbers are copied from the printed invoices, not recalculated.</strong> '+
      'Invoice 8 GET Total Billed is <strong>$0.01 more</strong> than Prior + Current; Invoice 9 is internally consistent and carries that printed GET total forward. '+

    const grid=document.querySelector('#comparison-grid');
    const prevBtn=document.querySelector('#nav-prev');
    const nextBtn=document.querySelector('#nav-next');
    const moneyActive=v=>v && v!=='-' && v!=='0' && v!=='0.00';

    function pairLabel(shown){
      if(shown.length<2) return shown[0]?`Invoice #${shown[0].number}`:'Invoices';
      return `Invoice #${shown[0].number} and Invoice #${shown[1].number}`;
    }

    function renderInvoice(invoice,prev,isLeft){
      const article=document.createElement('article');
      article.className='invoice-page';
      article.setAttribute('aria-labelledby',`invoice-${invoice.number}-title`);
      const sameTitle='Total billed on the older invoice is Prior billed on the newer invoice';
      article.innerHTML=
        `<h1 class="invoice-title" id="invoice-${invoice.number}-title">Invoice #${invoice.number}</h1>`+
        `<header class="billing-period">`+
          `<span>Professional Services for billing period:</span>`+
          `<time class="from" datetime="${invoice.isoStart}">${invoice.start}</time>`+
          `<span class="word-to">to</span>`+
          `<time class="to-date" datetime="${invoice.isoEnd}">${invoice.end}</time>`+
        `</header>`+
        `<table>`+
          `<colgroup><col class="description"><col class="amount"><col class="percent"><col class="money"><col class="money"><col class="money"><col class="money"></colgroup>`+
          `<thead><tr>`+
            `<th></th><th>Contract Amount</th><th>Percent<br>Complete</th>`+
            `<th${isLeft?` class="same-col" title="${sameTitle}"`:''}>Total<br>Billed</th>`+
            `<th>Remaining</th>`+
            `<th${!isLeft&&prev?` class="same-col" title="${sameTitle}"`:''}>Prior<br>Billed</th>`+
            `<th>Current Billed</th>`+
          `</tr></thead><tbody></tbody>`+
        `</table>`+
        (invoice.notes?`<p class="penny">${invoice.notes}</p>`:'');
      const tbody=article.querySelector('tbody');
      for(const row of rows){
        const tr=document.createElement('tr');
        if(!Array.isArray(row)){
          tr.className=row.type;
          const td=document.createElement('td');
          td.colSpan=7;
          td.textContent=row.label||'';
          tr.appendChild(td);
          if(row.type==='stage') tr.dataset.key=row.label;
        }else{
          const [key,label,contract,kind,note]=row;
          tr.className=kind||'item';
          tr.dataset.key=key;
          const labelCell=document.createElement('td');
          labelCell.className='description';
          labelCell.textContent=label;
          if(note) labelCell.title=note;
          tr.appendChild(labelCell);
          const vals=invoice.values[key];
          [contract,...vals].forEach((value,i)=>{
            const td=document.createElement('td');
            td.className='num';
            td.textContent=value;
            if(i===1 && prev && prev.values[key] && prev.values[key][0]!==vals[0]) td.classList.add('pct-change');
            if(i===5 && moneyActive(value)) td.classList.add('this-period');
            if((isLeft && i===2) || (!isLeft && prev && i===4)){
              td.classList.add('same-col');
              td.title=sameTitle;
            }
            tr.appendChild(td);
          });
        }
        tbody.appendChild(tr);
      }
      return article;
    }

    function updateNav(shown){
      const atStart=startIndex<=0;
      const atEnd=startIndex>=ordered.length-PAIR;
      prevBtn.disabled=atStart;
      nextBtn.disabled=atEnd;
      prevBtn.setAttribute('aria-label',atStart?'No earlier invoice available':`Show ${pairLabel(ordered.slice(startIndex-1,startIndex+1))}`);
      nextBtn.setAttribute('aria-label',atEnd?'No later invoice available':`Show ${pairLabel(ordered.slice(startIndex+1,startIndex+3))}`);
      grid.setAttribute('aria-label',pairLabel(shown));
    }

    function render(){
      const shown=ordered.slice(startIndex,startIndex+PAIR);
      document.title=`Invoice Comparison — ${pairLabel(shown)}`;
      grid.replaceChildren();
      shown.forEach((invoice,index)=>grid.appendChild(renderInvoice(invoice,index>0?shown[index-1]:null,index===0)));
      updateNav(shown);
    }

    prevBtn.addEventListener('click',()=>{if(prevBtn.disabled||startIndex<=0)return;startIndex-=1;render()});
    nextBtn.addEventListener('click',()=>{if(nextBtn.disabled||startIndex>=ordered.length-PAIR)return;startIndex+=1;render()});
    render();

    grid.addEventListener('pointerover',e=>{
      const tr=e.target.closest('tr[data-key]');
      if(!tr) return;
      const key=tr.dataset.key;
      for(const hit of grid.querySelectorAll('tr[data-key]')) hit.classList.toggle('hover',hit.dataset.key===key);
    });
    grid.addEventListener('pointerleave',()=>{
      for(const hit of grid.querySelectorAll('tr.hover')) hit.classList.remove('hover');
    });
  </script>
</body>
</html>
