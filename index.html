    .invoice-title{margin:0 0 7px;font-size:20px;line-height:1.15;text-align:center}
    .billing-period{display:grid;grid-template-columns:1fr 82px 22px 82px;align-items:end;height:23px;border-bottom:1px solid var(--rule);font-size:12px;font-weight:700;font-style:italic}

    table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11px;line-height:1}

    thead tr{height:31px}thead th{padding:2px 1px 3px;border-bottom:1px solid var(--rule);font-weight:400;line-height:1.15;text-align:right;vertical-align:bottom}thead th:first-child{text-align:left}

    tbody td{padding:1px;vertical-align:middle}td.description{overflow:hidden;white-space:nowrap;text-overflow:clip}td.num{text-align:right}
    tr.stage td{padding-top:3px;font-weight:700}tr.subtotal td,tr.summary td{background:var(--subtotal);font-weight:700}
    tr.grand-total td{padding-top:4px;border-top:1px solid var(--rule);border-bottom:3px double var(--rule);font-weight:700}
    @media(min-width:1780px){table{font-size:11.5px}}
    @media(max-width:760px){.comparison-shell{padding:0}.comparison-grid{display:flex;width:max-content;gap:6px}.invoice-page{width:590px;box-shadow:none}}
    @media print{@page{size:legal landscape;margin:.25in}body{background:#fff}.comparison-shell{padding:0;overflow:visible}.comparison-grid{width:100%;gap:8px}.invoice-page{padding:6px;box-shadow:none}.invoice-title{font-size:14px}table,.billing-period{font-size:8px}}
